name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Textbook readers (text, figures, audio) never go on this open site, whoever pushed (25 Nov 2026).
      - run: bash .github/check-readers.sh .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub can list the uploaded artifact a moment late; deploy-pages then finds none and the run
      # fails (seen 24 Nov 2026, three attempts out of four). A short wait avoids that.
      - run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4
